name: ci
# pull requests only (checks run locally first; the merge needs no second run). engine (both packages' lint, typecheck
# and tests, then the site's build, headers and audit) and e2e are required checks on main, so the workflow always
# runs: a docs-only change skips them by condition, which reports success
on:
  pull_request:
permissions:
  contents: read
# a newer push to the same PR cancels the run it supersedes
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
# actions are pinned to commit SHAs (tags can move); Dependabot proposes updates
jobs:
  # does the PR touch anything besides docs (docs/**, *.md)?
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qvE '^docs/|\.md$'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
  engine:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      # both packages: the engine (engine/) and the app (web/)
      - run: npm run lint
        working-directory: .
      - run: npm run typecheck
        working-directory: .
      - run: npm test
        working-directory: .
      - run: npm run build
      # what Vercel will serve: headers on pages and assets, CSP meta on every page
      - run: npm run check:headers
      # gate on what ships to browsers (vue, vexflow, the engine); build tooling advisories are reported, not blocking
      - run: npm audit --omit=dev --audit-level=high
        working-directory: .
      - run: npm audit --audit-level=high || true
        working-directory: .
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
