name: ci
# pull requests only (checks run locally first; the merge needs no second run). engine (both packages' lint, typecheck
# and tests, then the site's build, headers and audit) and e2e are required checks on main, so the workflow always
# runs: a docs-only change skips them by condition, which reports success
on:
  pull_request:
permissions:
  contents: read
# a newer push to the same PR cancels the run it supersedes
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
# actions are pinned to commit SHAs (tags can move); Dependabot proposes updates
jobs:
  # does the PR touch anything besides docs (docs/**, *.md)? and does it only add charts (with their fixtures)?
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      charts_only: ${{ steps.diff.outputs.charts_only }}
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qvE '^docs/|\.md$'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # new library charts and the regenerated fixtures, nothing else: an edited or deleted chart may be one a spec
          # opens, so it runs every spec
          other=$(git diff --name-status "origin/$BASE_REF...HEAD" | grep -vE $'^[A-Z0-9]+\t(docs/|[^\t]*\.md$)' | grep -vcE $'^A\tengine/charts/[^/]+\.txt$|^M\tengine/fixtures/(golden|analysis)\.json$' || true)
          if [ "$code" = true ] && [ "$other" = 0 ]; then charts_only=true; else charts_only=false; fi
          echo "charts_only=$charts_only" >> "$GITHUB_OUTPUT"
          # the interface (web/app/): the accessibility scans run
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -q '^web/app/'; then app=true; else app=false; fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
  engine:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      # both packages: the engine (engine/) and the app (web/)
      - run: npm run lint
        working-directory: .
      - run: npm run typecheck
        working-directory: .
      - run: npm test
        working-directory: .
      - run: npm run build
      # every internal link and #fragment on the prerendered site resolves (build/links.ts)
      - run: npm run check:links
      # what Vercel will serve: headers on pages and assets, CSP meta on every page
      - run: npm run check:headers
      # gate on what ships to browsers (vue, vexflow, the engine); build tooling advisories are reported, not blocking
      - run: npm audit --omit=dev --audit-level=high
        working-directory: .
      - run: npm audit --audit-level=high || true
        working-directory: .
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      # Chromium is cached by Playwright version; only a miss downloads it with its system packages (the runner image
      # has what a cached browser needs)
      - id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # a PR that only adds charts runs the specs that read the whole library (A–Z, sitemap, every song page)
      - run: npm run e2e ${{ needs.changes.outputs.charts_only == 'true' && '-- e2e/library.spec.ts e2e/seo.spec.ts' || '' }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
  # the axe scans of key pages and popovers (web/e2e/a11y/; the template lint runs in engine's lint), on PRs that touch
  # the interface; not a required check
  a11y:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - run: npm run a11y
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report
          path: web/playwright-report
          retention-days: 7
